[package]
name = "fossps"
description = "Free, open-source engine for multiplayer FPS games"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["window"]
# Opens a window and reads keyboard, mouse and gamepads. A dedicated server
# builds without it and links no windowing or gamepad libraries.
window = ["dep:winit", "dep:gilrs", "dep:softbuffer"]

[dependencies]
fossps-input = { path = "../fossps-input" }
log = "0.4"
winit = { version = "0.30", optional = true }
gilrs = { version = "0.11", optional = true }
# Temporary: fills the window until the Vulkan renderer draws into it.
softbuffer = { version = "0.4", optional = true }

[[bin]]
name = "fossps"
required-features = ["window"]

[lints]
workspace = true
