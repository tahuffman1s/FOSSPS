[package]
name = "fossps"
description = "Free, open-source engine for multiplayer FPS games"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["window", "cli"]
# Opens a window, draws into it and reads keyboard, mouse and gamepads. A
# dedicated server builds without it and links no windowing, graphics or
# gamepad libraries.
window = ["dep:winit", "dep:gilrs", "dep:fossps-render"]
# The `fossps` command (`fossps new`, `fossps run`). Off when the crate is used
# as a library, so a game written in Rust does not build a command-line parser.
cli = ["dep:clap"]

[dependencies]
fossps-input = { path = "../fossps-input" }
fossps-script = { path = "../fossps-script" }
fossps-render = { path = "../fossps-render", optional = true }
log = "0.4"
# Ctrl-C and the operating system's "please end" requests, for a clean server stop.
ctrlc = { version = "3.4", features = ["termination"] }
winit = { version = "0.30", optional = true }
gilrs = { version = "0.11", optional = true }
clap = { version = "4.5", optional = true, default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
    "suggestions",
    "color",
] }

[[bin]]
name = "fossps"
required-features = ["window", "cli"]

[lints]
workspace = true
