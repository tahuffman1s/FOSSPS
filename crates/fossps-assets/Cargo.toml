[package]
name = "fossps-assets"
description = "Reads glTF levels and models into FOSSPS engine data"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["textures"]
# Decodes the PNG and JPEG images a file uses. A dedicated server only needs
# the shapes, so it builds without this and links no image decoders.
textures = ["dep:image"]

[dependencies]
# Without `import`, so reading a file's buffers and images is ours to do and a
# build without `textures` has no image decoder in it.
gltf = { version = "1.4", default-features = false, features = [
    "utils",
    "names",
    "extras",
    "extensions",
    "KHR_texture_transform",
    "KHR_materials_emissive_strength",
    "KHR_lights_punctual",
] }
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg"] }
# Tangents for normal-mapped meshes that were exported without them.
bevy_mikktspace = "1.0"
# Files that carry their data inside themselves (`data:` addresses).
base64 = "0.22"
log = "0.4"

[lints]
workspace = true
