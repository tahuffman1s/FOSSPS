[package]
name = "fossps-render"
description = "The FOSSPS Vulkan 1.3 renderer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# `loaded` finds the Vulkan library when the game starts, so building FOSSPS
# needs no Vulkan SDK.
ash = { version = "0.38", default-features = false, features = ["loaded", "std", "debug"] }
ash-window = "0.13"
raw-window-handle = { version = "0.6", features = ["std"] }
log = "0.4"
# The scenes the renderer draws. Without its image decoders: whoever reads a
# file decodes its pictures, and the renderer is handed the pixels.
fossps-assets = { path = "../fossps-assets", default-features = false }
# The list of boxes and text the HUD and menus ask for, and the trait text is measured through.
fossps-ui = { path = "../fossps-ui" }
# Turns the font's outlines into pixels for HUD and menu text. Pure Rust.
fontdue = { version = "0.9", default-features = false, features = ["std"] }
# FSR 3.1 upscaling, built from source.
fossps-fsr = { path = "../fossps-fsr" }
# The editor's panels (the `panels` feature). Without egui's own fonts: the
# editor gives it the font the engine already carries.
egui = { version = "0.36.2", default-features = false, optional = true }
# Draws egui with raw `ash` handles, inside a pass of ours. MIT.
egui-ash-renderer = { version = "0.13", default-features = false, optional = true }

[build-dependencies]
# Compiles the shaders in `shaders/` to SPIR-V, so no system shader compiler is needed.
naga = { version = "30", default-features = false, features = ["wgsl-in", "spv-out"] }

[lints]
workspace = true

[features]
# Draws the editor's panels, made with egui, over the picture:
# `Renderer::set_panels`. Off for games and servers.
panels = ["dep:egui", "dep:egui-ash-renderer"]
