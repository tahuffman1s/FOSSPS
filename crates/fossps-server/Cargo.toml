[package]
name = "fossps-server"
description = "Dedicated server for FOSSPS games: runs a game with no window or graphics card"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# No `window` feature: built on its own (`cargo build -p fossps-server`), the
# server links no windowing, graphics or gamepad libraries.
fossps = { path = "../fossps", default-features = false, features = ["cli"] }
clap = { version = "4.5", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
    "suggestions",
    "color",
] }

[lints]
workspace = true
