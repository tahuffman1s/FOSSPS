name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        # mesa-vulkan-drivers brings lavapipe, a software Vulkan, so the
        # renderer's drawing test runs for real instead of being skipped.
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libasound2-dev libvulkan1 mesa-vulkan-drivers vulkan-validationlayers
          echo "FOSSPS_REQUIRE_VULKAN=1" >> "$GITHUB_ENV"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # A dedicated server reads levels without the image decoders.
      - run: cargo test -p fossps-assets --no-default-features
      # Sound mixes into a buffer without linking a sound library.
      - run: cargo test -p fossps-audio --no-default-features --lib --tests
      # The dedicated server builds on its own, without the window feature.
      - run: cargo build -p fossps-server

  # Draws the benchmark scene and fails if its frames have become much slower.
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - name: Install Linux build dependencies
        # lavapipe draws on the processor: these machines have no graphics card.
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libasound2-dev libvulkan1 mesa-vulkan-drivers
      - run: cargo build --release -p fossps
      # The budget is for a slow frame (99 of 100 are faster) on lavapipe on
      # this kind of machine, with room for a busy one; see docs/decisions.md.
      - name: Benchmark
        run: |
          set -o pipefail
          ./target/release/fossps bench --budget-ms 300 --json bench.json | tee bench.txt
      - name: Show the numbers
        if: always()
        run: |
          {
            echo '```'
            cat bench.txt 2>/dev/null || echo 'The benchmark did not run.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench
          path: bench.json
          if-no-files-found: ignore
