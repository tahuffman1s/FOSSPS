name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        # mesa-vulkan-drivers brings lavapipe, a software Vulkan, so the
        # renderer's drawing test runs for real instead of being skipped.
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libasound2-dev libvulkan1 mesa-vulkan-drivers vulkan-validationlayers
          echo "FOSSPS_REQUIRE_VULKAN=1" >> "$GITHUB_ENV"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # A dedicated server reads levels without the image decoders.
      - run: cargo test -p fossps-assets --no-default-features
      # Sound mixes into a buffer without linking a sound library.
      - run: cargo test -p fossps-audio --no-default-features --lib --tests
      # The dedicated server builds on its own, without the window feature.
      - run: cargo build -p fossps-server
